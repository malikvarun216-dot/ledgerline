version: 2

# Staging = RAW.SILVER_CHANGES split by table and typed, one view per Silver table. Every change
# row is kept (inserts, update post-images, deletes); nothing is picked or filtered here.
# Common columns: change_type, commit_version, commit_ts (Databricks commit time — NOT business
# time), night (1, 2, 3 ... over the table's versions), source_file, source_row, loaded_at.

models:
  - name: stg_customer
    description: Customer (one person = customer_unique_id), every night's change.
    data_tests:
      - no_conflicting_changes: {arguments: {key: ['customer_unique_id']}}
    columns:
      - name: customer_unique_id
        data_tests: [not_null]
      - name: dim_updated_at
        description: Business time — when this version became true in Olist. Never the run time.
        data_tests: [not_null]

  - name: stg_product
    data_tests:
      - no_conflicting_changes: {arguments: {key: ['product_id']}}
    columns:
      - name: product_id
        data_tests: [not_null]
      - name: dim_updated_at
        data_tests: [not_null]

  - name: stg_seller
    data_tests:
      - no_conflicting_changes: {arguments: {key: ['seller_id']}}
    columns:
      - name: seller_id
        data_tests: [not_null]
      - name: dim_updated_at
        data_tests: [not_null]

  - name: stg_customer_order_link
    description: >
      Which person (customer_unique_id) each order's customer_id belongs to (Session 15). Rows only
      ever appear; dim_updated_at = the order's purchase time.
    data_tests:
      - no_conflicting_changes: {arguments: {key: ['customer_id']}}
    columns:
      - name: customer_id
        data_tests: [not_null]
      - name: customer_unique_id
        data_tests: [not_null]

  - name: int_customer_order_link
    description: >
      The link as Silver holds it now — one row per customer_id. Derived (newest change, deletes
      dropped), so it is a view in STAGING, not a GOLD model: analysts read the person on the fact.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_orders
    data_tests:
      - no_conflicting_changes: {arguments: {key: ['order_id']}}
    columns:
      - name: order_id
        data_tests: [not_null]

  - name: stg_order_items
    data_tests:
      - no_conflicting_changes: {arguments: {key: ['order_id', 'order_item_id']}}
    columns:
      - name: order_id
        data_tests: [not_null]

  - name: stg_inventory
    data_tests:
      - no_conflicting_changes: {arguments: {key: ['sku_key']}}
    columns:
      - name: sku_key
        data_tests: [not_null]

  - name: stg_inventory_events
    data_tests:
      - no_conflicting_changes: {arguments: {key: ['event_id']}}
    columns:
      - name: event_id
        data_tests: [not_null]
