version: 2

# GOLD is what the analyst role reads (future grants, snowflake/06_gold_schemas.sql). Every model
# here has an ENFORCED CONTRACT: dbt checks the SQL's columns and types against this file before
# it builds, and refuses the build if they differ — a renamed or retyped column cannot reach an
# analyst by accident. Staging has no contracts: it is ours, and changes with Silver.

models:
  - name: customer_current
    description: One row per person (customer_unique_id) as Silver holds them now.
    config:
      meta: {row_policy: customer_state}
      contract: {enforced: true}
    columns:
      - name: customer_unique_id
        data_type: varchar
        config: {meta: {pii_class: public}}
        constraints: [{type: not_null}, {type: primary_key}]
        data_tests: [unique, not_null]
      - {name: customer_zip_code_prefix, data_type: varchar, description: "Masked ('***') for readers by tag PII_CLASS; a reader's filter on it matches nothing, not an error (S18).", config: {meta: {pii_class: restricted}}}
      - {name: customer_city, data_type: varchar, description: "Masked ('***') for readers by tag PII_CLASS; a reader's filter on it matches nothing, not an error (S18).", config: {meta: {pii_class: restricted}}}
      - {name: customer_state, data_type: varchar, config: {meta: {pii_class: public}}}
      - name: dim_updated_at
        data_type: timestamp_ntz
        description: Business time — when this version became true in Olist.
        constraints: [{type: not_null}]
      - name: _first_seen_dump_date
        data_type: date
      - name: _last_changed_dump_date
        data_type: date
      - name: silver_version
        data_type: number
        description: The Silver change-feed version this row comes from.
      - name: silver_night
        data_type: number
        description: The n-th change-feed version of the table (for the dimensions, the n-th dump).

  - name: product_current
    config:
      contract: {enforced: true}
    columns:
      - name: product_id
        data_type: varchar
        config: {meta: {pii_class: public}}
        constraints: [{type: not_null}, {type: primary_key}]
        data_tests: [unique, not_null]
      - {name: product_category_name, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: product_weight_g, data_type: number}
      - {name: product_length_cm, data_type: number}
      - {name: product_height_cm, data_type: number}
      - {name: product_width_cm, data_type: number}
      - {name: product_photos_qty, data_type: number}
      - name: dim_updated_at
        data_type: timestamp_ntz
        description: Business time — when this version became true in Olist.
        constraints: [{type: not_null}]
      - name: _first_seen_dump_date
        data_type: date
      - name: _last_changed_dump_date
        data_type: date
      - name: silver_version
        data_type: number
        description: The Silver change-feed version this row comes from.
      - name: silver_night
        data_type: number
        description: The n-th change-feed version of the table (for the dimensions, the n-th dump).

  - name: seller_current
    config:
      contract: {enforced: true}
    columns:
      - name: seller_id
        data_type: varchar
        config: {meta: {pii_class: public}}
        constraints: [{type: not_null}, {type: primary_key}]
        data_tests: [unique, not_null]
      - {name: seller_zip_code_prefix, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: seller_city, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: seller_state, data_type: varchar, config: {meta: {pii_class: public}}}
      - name: dim_updated_at
        data_type: timestamp_ntz
        description: Business time — when this version became true in Olist.
        constraints: [{type: not_null}]
      - name: _first_seen_dump_date
        data_type: date
      - name: _last_changed_dump_date
        data_type: date
      - name: silver_version
        data_type: number
        description: The Silver change-feed version this row comes from.
      - name: silver_night
        data_type: number
        description: The n-th change-feed version of the table (for the dimensions, the n-th dump).

  - name: inventory_current
    config:
      contract: {enforced: true}
    columns:
      - name: sku_key
        data_type: varchar
        config: {meta: {pii_class: public}}
        constraints: [{type: not_null}, {type: primary_key}]
        data_tests: [unique, not_null]
      - {name: product_id, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: seller_id, data_type: varchar, config: {meta: {pii_class: public}}}
      - name: stock_qty
        data_type: number
        data_tests:
          - not_null
      - {name: seq, data_type: number}
      - {name: _event_ts, data_type: timestamp_ntz}
      - {name: silver_version, data_type: number}
      - {name: silver_night, data_type: number}

  - name: dim_customer
    description: SCD2 customer from the customer_history snapshot. Point in time = valid_from <= T < valid_to.
    config:
      meta: {row_policy: customer_state}
      contract: {enforced: true}
    data_tests:
      - scd2_shape: {arguments: {key: customer_unique_id}}
    columns:
      - name: customer_unique_id
        data_type: varchar
        config: {meta: {pii_class: public}}
        data_tests: [not_null]
      - {name: customer_zip_code_prefix, data_type: varchar, description: "Masked ('***') for readers by tag PII_CLASS; a reader's filter on it matches nothing, not an error (S18).", config: {meta: {pii_class: restricted}}}
      - {name: customer_city, data_type: varchar, description: "Masked ('***') for readers by tag PII_CLASS; a reader's filter on it matches nothing, not an error (S18).", config: {meta: {pii_class: restricted}}}
      - {name: customer_state, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: valid_from, data_type: timestamp_ntz}
      - {name: valid_to, data_type: timestamp_ntz}
      - {name: is_current, data_type: boolean}
      - {name: silver_night, data_type: number}

  - name: dim_product
    description: SCD2 product from the product_history snapshot. Point in time = valid_from <= T < valid_to.
    config:
      contract: {enforced: true}
    data_tests:
      - scd2_shape: {arguments: {key: product_id}}
    columns:
      - name: product_id
        data_type: varchar
        config: {meta: {pii_class: public}}
        data_tests: [not_null]
      - {name: product_category_name, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: product_weight_g, data_type: number}
      - {name: product_length_cm, data_type: number}
      - {name: product_height_cm, data_type: number}
      - {name: product_width_cm, data_type: number}
      - {name: product_photos_qty, data_type: number}
      - {name: valid_from, data_type: timestamp_ntz}
      - {name: valid_to, data_type: timestamp_ntz}
      - {name: is_current, data_type: boolean}
      - {name: silver_night, data_type: number}

  - name: dim_seller
    description: SCD2 seller from the seller_history snapshot. Point in time = valid_from <= T < valid_to.
    config:
      contract: {enforced: true}
    data_tests:
      - scd2_shape: {arguments: {key: seller_id}}
    columns:
      - name: seller_id
        data_type: varchar
        config: {meta: {pii_class: public}}
        data_tests: [not_null]
      - {name: seller_zip_code_prefix, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: seller_city, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: seller_state, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: valid_from, data_type: timestamp_ntz}
      - {name: valid_to, data_type: timestamp_ntz}
      - {name: is_current, data_type: boolean}
      - {name: silver_night, data_type: number}

  # ---- Facts (Session 15) -------------------------------------------------------------------------
  - name: fct_orders
    description: >
      One row per order as Silver holds it now. Incremental (merge_changes: in-band deletes, a
      high-water mark on raw_loaded_at minus one hour, since S17); an order whose person is not linked yet is re-tried on
      every run until the customer_order_link night that holds it has landed. Permanent table
      (not dbt's transient default) since Session 16.
    config:
      contract: {enforced: true}
    data_tests:
      - fct_equals_rebuild:
          arguments: {staging: stg_orders, key: [order_id]}
    columns:
      - name: order_id
        data_type: varchar
        config: {meta: {pii_class: public}}
        constraints: [{type: not_null}, {type: primary_key}]
        data_tests: [unique, not_null]
      - {name: customer_id, data_type: varchar, description: "Per-ORDER id (Olist issues one per order). Not the person.", config: {meta: {pii_class: public}}}
      - name: customer_unique_id
        data_type: varchar
        config: {meta: {pii_class: public}}
        description: The person, from customer_order_link. NULL until the link's night has landed.
        data_tests:
          - not_null:
              config:
                severity: warn   # an order placed after the newest dims night waits for the next one
      - {name: status, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: source_status, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: created_at, data_type: timestamp_ntz, description: "Business time the order was placed — the point-in-time join's T."}
      - {name: approved_at, data_type: timestamp_ntz}
      - {name: shipped_at, data_type: timestamp_ntz}
      - {name: delivered_at, data_type: timestamp_ntz}
      - {name: canceled_at, data_type: timestamp_ntz}
      - {name: unavailable_at, data_type: timestamp_ntz}
      - {name: estimated_delivery_at, data_type: timestamp_ntz}
      - {name: units, data_type: number}
      - {name: silver_version, data_type: number, description: "Change-feed version of Silver orders this row comes from; decides which change wins (merge_changes >=)."}
      - {name: silver_change_type, data_type: varchar, description: "insert or update_postimage (a delete removes the row).", config: {meta: {pii_class: public}}}
      - {name: raw_loaded_at, data_type: timestamp_ltz, description: "When this row's change arrived in RAW; the high-water mark (minus one hour), S17."}

  - name: fct_order_items
    description: One row per order item = one unit sold, as Silver holds it now. Incremental, merge_changes.
    config:
      contract: {enforced: true}
    data_tests:
      - fct_equals_rebuild:
          arguments: {staging: stg_order_items, key: [order_id, order_item_id]}
    columns:
      - name: order_id
        data_type: varchar
        config: {meta: {pii_class: public}}
        constraints: [{type: not_null}]
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('fct_orders'), field: order_id}}
      - name: order_item_id
        data_type: number
        constraints: [{type: not_null}]
      - {name: product_id, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: seller_id, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: sku_key, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: price, data_type: "number(12,2)"}
      - {name: freight_value, data_type: "number(12,2)"}
      - {name: silver_version, data_type: number}
      - {name: silver_change_type, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: raw_loaded_at, data_type: timestamp_ltz, description: "When the change arrived in RAW; the high-water mark (minus one hour), S17."}

  - name: order_items_at_sale
    description: >
      Each order item with the customer, product and seller as they were when the order was placed
      (point-in-time join to the SCD2 dimensions, resolved at query time).
    config:
      meta: {row_policy: customer_state}
      contract: {enforced: true}
    columns:
      - {name: order_id, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: order_item_id, data_type: number}
      - {name: ordered_at, data_type: timestamp_ntz}
      - {name: order_status, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: customer_unique_id, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: customer_city, data_type: varchar, description: "Masked ('***') for readers by tag PII_CLASS; a reader's filter on it matches nothing, not an error (S18).", config: {meta: {pii_class: restricted}}}
      - {name: customer_state, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: product_id, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: product_category_name, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: seller_id, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: seller_city, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: seller_state, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: price, data_type: "number(12,2)"}
      - {name: freight_value, data_type: "number(12,2)"}
      - {name: customer_found, data_type: boolean, description: "A customer version covered the order time."}
      - {name: customer_inferred, data_type: boolean, description: "None did; the person's FIRST version is shown instead (97.4% right, Session 15)."}
      - {name: product_found, data_type: boolean}
      - {name: seller_found, data_type: boolean}

  - name: fct_reviews
    description: >
      One row per customer review (review_id + order_id: neither is unique alone), as Silver holds it
      now. Incremental, merge_changes, arrival mark (Session 22). The review text is restricted:
      readers get the score and, through review_labels, the AI's sentiment and topic — not the words.
    config:
      contract: {enforced: true}
    data_tests:
      - fct_equals_rebuild:
          arguments: {staging: stg_review, key: [review_id, order_id]}
    columns:
      - name: review_id
        data_type: varchar
        config: {meta: {pii_class: public}}
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: order_id
        data_type: varchar
        config: {meta: {pii_class: public}}
        constraints: [{type: not_null}]
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('fct_orders'), field: order_id}}
      - name: review_score
        data_type: number
        data_tests:
          - accepted_values: {arguments: {values: [1, 2, 3, 4, 5], quote: false}}
      - {name: review_comment_title, data_type: varchar, description: "Free text; masked ('***') for readers.", config: {meta: {pii_class: restricted}}}
      - {name: review_comment_message, data_type: varchar, description: "Free text; masked ('***') for readers.", config: {meta: {pii_class: restricted}}}
      - {name: has_message, data_type: boolean, description: "The message holds more than white space."}
      - {name: message_hash, data_type: varchar, description: "SHA-256 of the trimmed message, the key of review_labels; NULL when there is nothing to label.", config: {meta: {pii_class: public}}}
      - {name: review_created_at, data_type: timestamp_ntz, description: "The day the customer wrote it (Olist gives a date)."}
      - {name: review_answered_at, data_type: timestamp_ntz, description: "When the marketplace answered; NULL until then."}
      - {name: silver_version, data_type: number}
      - {name: silver_change_type, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: raw_loaded_at, data_type: timestamp_ltz}

  - name: delivery_promise
    description: >
      Are our delivery promises honest? One row per delivered order: promised date, delivered date,
      days late (negative = early), the lateness bucket, and the order's newest review (Session 22).
    config:
      materialized: table
      meta: {row_policy: customer_state}
      contract: {enforced: true}
    columns:
      - name: order_id
        data_type: varchar
        config: {meta: {pii_class: public}}
        constraints: [{type: not_null}, {type: primary_key}]
        data_tests: [unique, not_null]
      - {name: customer_unique_id, data_type: varchar, config: {meta: {pii_class: public}}}
      - name: customer_state
        data_type: varchar
        config: {meta: {pii_class: public}}
        description: Where the person lived when they ordered (point in time). The row policy's column.
        data_tests: [not_null]
      - {name: seller_count, data_type: number}
      - {name: items, data_type: number}
      - {name: order_status, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: purchased_at, data_type: timestamp_ntz}
      - {name: purchase_month, data_type: date}
      - {name: promised_at, data_type: timestamp_ntz, description: "The estimated delivery date shown at purchase."}
      - {name: delivered_at, data_type: timestamp_ntz}
      - {name: promised_days, data_type: number}
      - {name: actual_days, data_type: number}
      - {name: days_late, data_type: number, description: "Delivered date minus promised date, in calendar days; negative = early."}
      - {name: is_late, data_type: boolean}
      - {name: lateness_bucket, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: lateness_bucket_order, data_type: number}
      - {name: review_score, data_type: number}
      - {name: reviewed_at, data_type: timestamp_ntz}
      - {name: reviewed_before_delivery, data_type: boolean, description: "The customer rated the order before it arrived."}

  - name: late_vs_rating
    description: >
      Does a late delivery cost ratings? Delivered orders by purchase month x customer state x
      lateness bucket, with SUMS and COUNTS of review scores — divide summed score by summed count
      when rolling rows together, never average avg_score (Session 22).
    config:
      materialized: table
      meta: {row_policy: customer_state}
      contract: {enforced: true}
    columns:
      - {name: purchase_month, data_type: date}
      - {name: customer_state, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: lateness_bucket, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: lateness_bucket_order, data_type: number}
      - {name: is_late, data_type: boolean}
      - {name: delivered_orders, data_type: number}
      - {name: reviewed_orders, data_type: number}
      - {name: score_sum, data_type: number}
      - {name: low_score_orders, data_type: number, description: "Reviewed 1 or 2 stars."}
      - {name: five_star_orders, data_type: number}
      - {name: reviewed_before_delivery, data_type: number}
      - {name: avg_score, data_type: number, description: "For reading ONE row only."}

  - name: seller_scorecard
    description: >
      Which sellers hurt us? One row per seller per purchase month with volume, lateness and review
      score, and a tier from written rules (no model). A review counts for a seller only on a
      single-seller order (Session 22).
    config:
      materialized: table
      contract: {enforced: true}
    columns:
      - {name: seller_id, data_type: varchar, config: {meta: {pii_class: public}}, constraints: [{type: not_null}]}
      - {name: purchase_month, data_type: date, constraints: [{type: not_null}]}
      - {name: orders, data_type: number}
      - {name: items, data_type: number}
      - {name: revenue, data_type: "number(14,2)"}
      - {name: freight, data_type: "number(14,2)"}
      - {name: canceled_orders, data_type: number}
      - {name: delivered_orders, data_type: number}
      - {name: late_orders, data_type: number}
      - {name: reviewed_orders, data_type: number}
      - {name: score_sum, data_type: number}
      - {name: low_score_orders, data_type: number}
      - {name: shared_reviews_not_credited, data_type: number, description: "Reviews of multi-seller orders: counted here, credited to no seller."}
      - {name: late_rate, data_type: number}
      - {name: avg_score, data_type: number}
      - name: tier
        data_type: varchar
        config: {meta: {pii_class: public}}
        data_tests:
          - accepted_values: {arguments: {values: ['at risk', 'watch', 'good', 'too few orders']}}

  - name: review_labels
    description: >
      The AI's sentiment and topic per distinct review text, under the pinned model and prompt version
      (Session 22). Join to fct_reviews on message_hash.
    config:
      materialized: table
      contract: {enforced: true}
    columns:
      - name: message_hash
        data_type: varchar
        config: {meta: {pii_class: public}}
        constraints: [{type: not_null}, {type: primary_key}]
        data_tests: [unique, not_null]
      - name: sentiment
        data_type: varchar
        config: {meta: {pii_class: public}}
        data_tests:
          - accepted_values: {arguments: {values: ['positive', 'neutral', 'negative']}}
      - name: topic
        data_type: varchar
        config: {meta: {pii_class: public}}
        data_tests:
          - accepted_values: {arguments: {values: ['delivery', 'product', 'seller', 'price', 'other']}}
      - {name: label_ok, data_type: boolean, description: "false = the model answered outside the label set."}
      - {name: model, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: prompt_version, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: labelled_at, data_type: timestamp_ntz}
      - {name: silver_version, data_type: number}

  - name: complaint_trends
    description: >
      Reviews by month x AI topic x sentiment (Session 22). Grain = review. 'no text', 'not labelled'
      and 'unreadable answer' are kept as topics so a report shows what the AI did not cover.
    config:
      materialized: table
      contract: {enforced: true}
    columns:
      - {name: review_month, data_type: date}
      - {name: topic, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: sentiment, data_type: varchar, config: {meta: {pii_class: public}}}
      - {name: reviews, data_type: number}
      - {name: score_sum, data_type: number}
      - {name: low_score_reviews, data_type: number}

unit_tests:
  # B68, as a test: the newest change wins, a key whose newest change is a delete is gone, and a
  # change row loaded twice is one row. Filter-deletes-first would bring C2 back at its insert.
  - name: current_state_newest_change_then_drop_deletes
    model: customer_current
    given:
      - input: ref('stg_customer')
        rows:
          - {customer_unique_id: C1, customer_city: campinas,       change_type: insert,           commit_version: 1, night: 1, dim_updated_at: "2016-08-01 10:00:00"}
          - {customer_unique_id: C1, customer_city: sao paulo,      change_type: update_postimage, commit_version: 4, night: 4, dim_updated_at: "2017-07-01 10:00:00"}
          - {customer_unique_id: C2, customer_city: curitiba,       change_type: insert,           commit_version: 2, night: 2, dim_updated_at: "2016-12-01 10:00:00"}
          - {customer_unique_id: C2, customer_city: curitiba,       change_type: delete,           commit_version: 5, night: 5, dim_updated_at: "2016-12-01 10:00:00"}
          - {customer_unique_id: C3, customer_city: rio de janeiro, change_type: insert,           commit_version: 3, night: 3, dim_updated_at: "2017-03-01 10:00:00"}
          - {customer_unique_id: C3, customer_city: rio de janeiro, change_type: insert,           commit_version: 3, night: 3, dim_updated_at: "2017-03-01 10:00:00"}
    expect:
      rows:
        - {customer_unique_id: C1, customer_city: sao paulo,      silver_version: 4, silver_night: 4}
        - {customer_unique_id: C3, customer_city: rio de janeiro, silver_version: 3, silver_night: 3}

  # The incremental SELECT (is_incremental forced on). Mark = newest raw_loaded_at held (12:00) minus
  # one hour = 11:00. Reads what arrived after 11:00: new changes (O3, the delete O4), a change inside
  # the hour of overlap (O7, 11:30), and a LATE file whose version is below every version held (O6,
  # v1, arrived 12:30): the S17 fix, a version mark would skip it. Not read: O2's v5 (10:30). Read but
  # DROPPED: O5's v4 re-read inside the overlap (11:45), already held, nothing to re-link. RE-TRIES
  # an order whose person was missing once its link exists (O1, arrived 09:00) but not while it is
  # still missing (O5), and passes a delete through to the MERGE (O4) instead of dropping it.
  - name: fct_orders_incremental_retries_unlinked_and_reads_only_new_arrivals
    model: fct_orders
    overrides:
      macros:
        is_incremental: true
    given:
