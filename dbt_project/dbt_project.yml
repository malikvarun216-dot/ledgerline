# ledgerline — dbt: Gold on Snowflake (Session 14), Databricks as the second target after the trial.
#
# Run through the wrapper, which reads .env and points dbt at this folder:
#   python scripts/run_dbt.py build
#   python scripts/run_dbt.py snapshot --vars "{as_of_night: 3}"
#
# Layers (schemas made by SYSADMIN in snowflake/06_gold_schemas.sql — dbt creates tables, never
# schemas; decisions.md, Session 14):
#   STAGING    one view per Silver table: RAW.SILVER_CHANGES typed, every change kept
#   SNAPSHOTS  dbt snapshots: the SCD2 history of customer, product, seller
#   GOLD       what analysts read: current state and the SCD2 dimensions (contracts enforced)

name: ledgerline
version: "0.14.0"
config-version: 2
profile: ledgerline

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  # exp_05 / rebuilds: replay the dimension nights one at a time. Night n = the n-th change-feed
  # version of that Silver table (each dims night is one MERGE = one version). Unset = everything.
  as_of_night: null
  # Where the governor keeps tags and policies (snowflake/09_governance.sql, Session 18).
  governance_schema: LEDGERLINE.GOVERNANCE
  # The AI answers Gold shows (Session 22): ONE pinned (model, prompt version), the same pair the
  # Databricks labelling step asks under. A new pair is a deliberate backfill, then a change here.
  ai_label_model: databricks-meta-llama-3-3-70b-instruct
  ai_label_prompt_version: v1

models:
  ledgerline:
    +persist_docs: {relation: true, columns: true}
    # PERMANENT tables, not dbt-snowflake's default TRANSIENT (no Fail-safe): decisions.md, Session 16.
    +transient: false
    staging:
      +schema: staging
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
      # Column tags + row policy, re-applied after each build: CREATE OR REPLACE drops them (S18).
      +post-hook: "{{ apply_governance() }}"

snapshots:
  ledgerline:
    +schema: snapshots
    +transient: false   # SCD2 history is the one table a source cannot give back (Session 16)

tests:
  ledgerline:
    +severity: error

query-comment:
  comment: "ledgerline dbt {{ node.unique_id if node else 'operation' }}"
  append: true
