name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A second push to the same branch cancels the first. Nothing here is
# deployment; a superseded run has no value.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Deliberately NOT `-r requirements-dev.txt`.
      #
      # That file pulls pyspark, delta-spark, databricks-connect and three dbt
      # adapters through `-r requirements.txt` — several hundred MB, and none of
      # it is imported by anything the suite currently runs. The cloud SDK
      # imports in generators/_common.py are all lazy (inside __init__), so the
      # modules import cleanly without them.
      #
      # It stays this way only while that is true. The moment a session adds a
      # test that needs Spark or dbt, widen this list in the same commit —
      # a test skipped for a missing dependency is a test that is not running.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "pytest>=8.0" "ruff>=0.6"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest tests/

      # The generators must stay runnable without any cloud account, because
      # the offline sinks are what the whole suite and all local dev use.
      # This also proves the Avro schemas parse before Session 3 registers them.
      - name: Avro schemas parse
        run: |
          python generators/order_events.py --print-schema > /dev/null
          python generators/inventory_cdc.py --print-schema > /dev/null
