name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A second push to the same branch cancels the first. Nothing here is
# deployment; a superseded run has no value.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    # PINNED, not `ubuntu-latest`. GitHub migrates that label to Ubuntu 26 on
    # 2026-10-19, which would swap the OS, system libs and the toolchain that
    # pandas/pyarrow wheels resolve against -- on GitHub's schedule, mid-session.
    # Same reasoning as pinning the dependency list: the environment must not
    # move on its own. Bump this deliberately, and read the failure if it breaks.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Deliberately NOT `-r requirements-dev.txt`.
      #
      # That file pulls pyspark, delta-spark, databricks-connect and three dbt
      # adapters through `-r requirements.txt` — several hundred MB, and none of
      # it is imported by anything the suite currently runs. The cloud SDK
      # imports in generators/_common.py are all lazy (inside __init__), so the
      # modules import cleanly without them.
      #
      # It stays this way only while that is true. The moment a session adds a
      # test that needs Spark or dbt, widen this list in the same commit —
      # a test skipped for a missing dependency is a test that is not running.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "pytest>=8.0" "ruff>=0.6" "moto[s3]>=5.0" "boto3>=1.34" "fastavro>=1.9"

      # Session 2 added tests guarded by @pytest.mark.skipif on moto and
      # fastavro. A guard whose dependency is absent does not fail — it skips,
      # silently, and the suite still reports green. That is the jobpulse
      # prevention rule's exact failure mode, one level up: a test skipped for
      # a missing dependency is a test that is not running.
      #
      # So assert the optional dependencies are importable BEFORE pytest runs.
      # If someone trims the install list above, this step fails loudly instead
      # of the S3 and Avro suites quietly vanishing.
      - name: Optional test dependencies must be present, not skipped
        run: |
          python -c "import moto, boto3, fastavro; print('moto', moto.__version__)"

      - name: Lint
        run: python -m ruff check .

      # -W error::pytest.PytestUnraisableExceptionWarning is not the point here;
      # --strict-markers is. A typo'd skipif marker would otherwise be accepted
      # and the test silently never run.
      - name: Test
        run: python -m pytest tests/ --strict-markers -ra

      # The generators must stay runnable without any cloud account, because
      # the offline sinks are what the whole suite and all local dev use.
      # This also proves the Avro schemas parse before Session 3 registers them.
      - name: Avro schemas parse
        run: |
          python generators/order_events.py --print-schema > /dev/null
          python generators/inventory_cdc.py --print-schema > /dev/null
